name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/build_release.sh release

  linux-qemu-llvm-smoke:
    name: Linux QEMU LLVM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable vhost-vsock
        run: |
          if [[ ! -e /dev/vhost-vsock ]]; then
            sudo modprobe vhost_vsock
          fi
          test -c /dev/vhost-vsock
          sudo chmod a+rw /dev/vhost-vsock

      - name: Compare actiond and Linux host
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          ACTIOND_VM_CAS_IMAGE_SIZE_MIB: 8192
          ACTIOND_VM_MEMORY_MIB: 4096
        run: e2e/run_llvm_linux_vm_smoke.sh "$RUNNER_TEMP/actiond-linux-llvm"

      - name: Upload Linux LLVM smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-qemu-llvm-smoke
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/actiond-linux-llvm/*.md
            ${{ runner.temp }}/actiond-linux-llvm/*.log

  windows-llvm-smoke:
    name: Windows ${{ matrix.mode }} (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            mode: artifact-build
            runner: windows-11-arm
            extra_arguments: -BuildOnly
          - architecture: x86_64
            mode: llvm-smoke
            runner: windows-2025
            extra_arguments: -Jobs 8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifacts and run the configured Windows test
        shell: pwsh
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: e2e/run_llvm_windows_vm_smoke.ps1 -OutputDirectory "$env:RUNNER_TEMP\actiond-windows-llvm" -Architecture ${{ matrix.architecture }} ${{ matrix.extra_arguments }}

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.mode }}-${{ matrix.architecture }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}\actiond-windows-llvm\*.md
            ${{ runner.temp }}\actiond-windows-llvm\*.log
