name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/build_release.sh release

  linux-qemu-llvm-smoke:
    name: Linux QEMU ${{ matrix.mode }} (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            mode: build-only
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            mode: llvm-smoke
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM and vhost-vsock
        if: matrix.mode == 'llvm-smoke'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          if [[ ! -e /dev/vhost-vsock ]]; then
            sudo modprobe vhost_vsock
          fi
          test -c /dev/vhost-vsock
          sudo chmod a+rw /dev/vhost-vsock

      - name: Build Linux ARM64 release
        if: matrix.mode == 'build-only'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bazel build --config=remote \
            --remote_header="x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" \
            -c opt \
            //cmd/linux-actiond:linux-actiond_linux_arm64

      - name: Compare actiond and Linux host
        if: matrix.mode == 'llvm-smoke'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          ACTIOND_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ACTIOND_VM_CAS_IMAGE_SIZE_MIB: 8192
          ACTIOND_VM_MEMORY_MIB: 4096
        run: e2e/run_llvm_linux_vm_smoke.sh "$RUNNER_TEMP/actiond-linux-llvm-${{ matrix.architecture }}"

      - name: Upload Linux LLVM smoke results
        if: always() && matrix.mode == 'llvm-smoke'
        uses: actions/upload-artifact@v4
        with:
          name: linux-qemu-${{ matrix.mode }}-${{ matrix.architecture }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/actiond-linux-llvm-${{ matrix.architecture }}/*.md
            ${{ runner.temp }}/actiond-linux-llvm-${{ matrix.architecture }}/*.log
            ${{ runner.temp }}/actiond-linux-llvm-${{ matrix.architecture }}/*.txt

  windows-llvm-smoke:
    name: Windows ${{ matrix.mode }} (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            mode: artifact-build
            runner: windows-11-arm
            extra_arguments: -BuildOnly
          - architecture: x86_64
            mode: llvm-smoke
            runner: windows-2025
            extra_arguments: -Jobs 8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifacts and run the configured Windows test
        shell: pwsh
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: e2e/run_llvm_windows_vm_smoke.ps1 -OutputDirectory "$env:RUNNER_TEMP\actiond-windows-llvm" -Architecture ${{ matrix.architecture }} ${{ matrix.extra_arguments }}

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.mode }}-${{ matrix.architecture }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}\actiond-windows-llvm\*.md
            ${{ runner.temp }}\actiond-windows-llvm\*.log
