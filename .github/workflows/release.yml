name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release-binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/build_release.sh release

      - name: Publish release
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "release publishing requires a tag ref, got ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --title "${TAG_NAME}" --generate-notes
          fi
          gh release upload "${TAG_NAME}" \
            release/darwin-actiond_macos_arm64 \
            release/linux-actiond_linux_arm64 \
            release/linux-actiond_linux_x86_64 \
            release/windows-actiond_windows_arm64.exe \
            release/windows-actiond_windows_x86_64.exe \
            release/SHA256.txt \
            --clobber
